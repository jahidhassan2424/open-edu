[build]
  command = "npm run build && npm --prefix functions run build"
  publish = "build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/mongo"
  to = "/.netlify/functions/mongo-api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
